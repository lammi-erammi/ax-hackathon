<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AX HACKATHON 2026 | egoidsm</title>
<meta name="description" content="에고이즘 AX 해커톤 2026 — 산출물 제출 · 비즈니스 임팩트 기입 · 구성원 투표 · 시상식">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
  tailwind.config = { corePlugins: { preflight: true } };
</script>
<style>
/* ───────── egoidsm.com 토큰 ───────── */
:root{
  --bg:#0b0b0c; --bg2:#121214; --card:#17171a; --card2:#1d1d21;
  --fg:#f4f2ed; --fg2:#cfcbc3; --mute:#8e8a82;
  --line:#2a2a2a; --line2:#333333; --line3:rgba(255,255,255,.2);
  --acc:#ED6D20; --acc2:#ff8a3d; --acc-soft:rgba(237,109,32,.12); --peach:#ffd9bd;
  --ok:#7fd1a0; --warn:#f2c14e; --bad:#e26d6d;
  --disp:'Oswald','Pretendard Variable',Pretendard,sans-serif;
  --body:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::selection{background:var(--acc);color:#0b0b0c}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:5px}::-webkit-scrollbar-track{background:transparent}

.disp{font-family:var(--disp)}
.eyebrow{font-family:var(--disp);font-weight:600;letter-spacing:.14em;color:var(--acc);font-size:13px;line-height:1;text-transform:uppercase}
.giant{font-size:clamp(38px,7.2vw,112px);line-height:.98;letter-spacing:-.045em;font-weight:800;margin:0}
.h2{font-size:clamp(26px,3.4vw,44px);letter-spacing:-.03em;font-weight:800;line-height:1.1}
.lead{font-size:clamp(16px,1.4vw,19px);color:var(--fg2)}
.mute{color:var(--mute)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.card2{background:var(--card2);border:1px solid var(--line2);border-radius:8px}
.k{font-family:var(--disp);letter-spacing:.12em;color:var(--acc);font-size:12px;line-height:1;text-transform:uppercase}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);letter-spacing:.08em;font-size:11px;border:1px solid var(--line2);padding:5px 9px;border-radius:4px;color:var(--fg2);line-height:1;text-transform:uppercase;white-space:nowrap}
.tag.acc{border-color:var(--acc);color:var(--acc)}
.tag.fill{background:var(--acc);border-color:var(--acc);color:#0b0b0c}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 22px;height:48px;border-radius:6px;background:var(--acc);color:#0b0b0c;font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap;transition:.18s;border:1px solid var(--acc);cursor:pointer}
.btn:hover{background:var(--acc2);border-color:var(--acc2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line3)}
.btn.ghost:hover{border-color:var(--fg);background:rgba(255,255,255,.06)}
.btn.sm{height:38px;padding:0 14px;font-size:13px}
.btn.xs{height:30px;padding:0 10px;font-size:12px;font-weight:700}
.btn.danger{background:transparent;color:var(--bad);border-color:rgba(226,109,109,.5)}
.btn.danger:hover{background:rgba(226,109,109,.1)}

.input,.select,.textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:6px;color:var(--fg);padding:12px 14px;font-size:15px;outline:none;transition:.15s;font-family:inherit}
.input:focus,.select:focus,.textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.input:disabled,.textarea:disabled,.select:disabled{opacity:.45;cursor:not-allowed}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:40px}
.textarea{min-height:120px;resize:vertical;line-height:1.6}
.label{display:block;font-size:13px;color:var(--fg2);margin-bottom:8px;font-weight:600}
.label .req{color:var(--acc);margin-left:3px}
.hint{font-size:12.5px;color:var(--mute);margin-top:6px}
.field{margin-bottom:22px}

/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(11,11,12,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:18px;height:64px}
.logo{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:12px}
.logo .sub{font-size:11px;letter-spacing:.18em;color:var(--acc);font-weight:600;border-left:1px solid var(--line2);padding-left:12px;line-height:1}
.menu{display:flex;gap:2px;margin-left:8px}
.menu a{padding:8px 12px;border-radius:6px;font-size:14px;color:var(--fg2);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.menu a:hover{color:var(--fg);background:rgba(255,255,255,.05)}
.menu a.on{color:var(--fg);background:rgba(255,255,255,.07)}
.menu a .lock{font-size:10px;color:var(--mute)}
.clock{font-family:var(--disp);letter-spacing:.06em;font-size:14px;color:var(--fg2);display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-family:var(--disp);letter-spacing:.1em;font-size:12px;text-transform:uppercase;color:var(--fg2)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.pill.live{border-color:var(--acc);color:var(--acc)}
.pill.live .dot{background:var(--acc);box-shadow:0 0 0 4px var(--acc-soft);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
@media (max-width:900px){.nav .wrap{height:auto;flex-wrap:wrap;padding:12px 16px;gap:10px}.menu{order:3;width:100%;margin-left:0;overflow-x:auto}.clock{margin-left:auto}.logo .sub{display:none}}

/* hero */
.hero{position:relative;padding:96px 0 64px;overflow:hidden}
.hero .horizon-bg{position:absolute;left:-10%;right:-10%;top:60%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,217,189,.7) 50%,transparent);box-shadow:0 0 60px 8px rgba(237,109,32,.25),0 0 160px 40px rgba(237,109,32,.10);pointer-events:none;opacity:.9}
.hero .grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:80px 80px;opacity:.25;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);pointer-events:none}
@media (max-width:700px){.hero{padding:56px 0 40px}}

/* timeline */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step{background:var(--card);padding:22px 22px 20px;position:relative;min-height:150px}
.step .num{font-family:var(--disp);font-size:13px;letter-spacing:.14em;color:var(--mute)}
.step h4{margin:10px 0 4px;font-size:18px;letter-spacing:-.02em}
.step .when{font-size:13px;color:var(--fg2)}
.step .st{position:absolute;top:18px;right:18px}
.step.now{background:linear-gradient(180deg,rgba(237,109,32,.16),rgba(237,109,32,.04));}
.step.now .num{color:var(--acc)}
.step.done{opacity:.6}
.step.now::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
.cd{font-family:var(--disp);font-weight:600;font-size:clamp(34px,5vw,64px);letter-spacing:.04em;line-height:1;font-variant-numeric:tabular-nums}
.cd small{font-size:.4em;letter-spacing:.14em;color:var(--mute);margin-left:6px}

/* entry card */
.ecard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;transition:.18s;position:relative}
.ecard:hover{border-color:var(--line3);transform:translateY(-2px)}
.ecard .title{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.ecard .who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg2)}
.ecard .who b{color:var(--fg)}
.ecard .ai{font-size:13.5px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ecard .media{display:flex;gap:8px;flex-wrap:wrap}
.ecard .media span{font-size:12px;color:var(--fg2);border:1px solid var(--line);padding:4px 8px;border-radius:4px;display:inline-flex;gap:6px;align-items:center}
.ecard .impact{border-top:1px solid var(--line);padding-top:12px;font-size:13.5px;color:var(--fg2)}
.ecard .impact .k{margin-bottom:6px}
.ecard.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.ecard .check{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;background:var(--bg2)}
.ecard.sel .check{background:var(--acc);border-color:var(--acc);color:#0b0b0c}
.ecard.mine{border-style:dashed;opacity:.65}
.rankbadge{position:absolute;top:-10px;left:16px;background:var(--acc);color:#0b0b0c;font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.1em;padding:4px 10px;border-radius:4px}

/* dropzone */
.drop{border:1px dashed var(--line3);border-radius:8px;padding:34px 20px;text-align:center;background:var(--bg2);transition:.15s;cursor:pointer}
.drop.over{border-color:var(--acc);background:var(--acc-soft)}
.drop i{font-size:26px;color:var(--acc);margin-bottom:8px}
.frow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card2);margin-top:8px;font-size:13.5px}
.frow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .bar{height:4px;background:var(--line2);border-radius:2px;overflow:hidden;width:120px}
.frow .bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.frow .pct{font-family:var(--disp);font-size:12px;width:44px;text-align:right;color:var(--fg2)}
.frow .rm{color:var(--mute);cursor:pointer}.frow .rm:hover{color:var(--bad)}

/* gate */
.gate{padding:64px 0;text-align:center}
.gate .icon{width:64px;height:64px;border-radius:50%;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:22px;color:var(--acc);margin-bottom:22px}

/* modal */
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--card);border:1px solid var(--line2);border-radius:12px;max-width:1000px;width:100%;max-height:92vh;overflow:auto;padding:28px;position:relative}
.modal .x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--bg2);color:var(--fg2);cursor:pointer}
.viewer{aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
.viewer iframe{width:100%;height:100%;border:0;display:block}
.viewer .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--fg2);background:radial-gradient(ellipse at 30% 20%,rgba(237,109,32,.25),transparent 60%),var(--bg2)}
.viewer .ph i{font-size:34px;color:var(--acc)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs button{border:1px solid var(--line2);background:var(--bg2);color:var(--fg2);padding:6px 10px;border-radius:4px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumbs button.on{border-color:var(--acc);color:var(--acc)}
/* 세로형 임베드(인스타 · 틱톡) 와 링크 스냅샷 */
.viewer.tall{aspect-ratio:9/16;height:min(70vh,760px);width:auto;max-width:100%;margin:0 auto}
/* 인스타그램: 상단(계정·프로필 보기)과 하단(더 보기·좋아요) 영역을 잘라내고 이미지 영역(4:5)만 보이도록 iframe 을 위로 당김 */
.viewer.ig{aspect-ratio:4/5;height:auto;width:min(480px,100%,calc(70vh * .8));margin:0 auto;background:#fff}
.viewer.ig iframe{position:absolute;left:0;top:-54px;width:100%;height:calc(100% + 54px + 360px)}
.reveal .viewer.tall{aspect-ratio:9/16;height:min(78vh,880px)}
.viewer.snap img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:opacity .4s;background:#111}
.viewer.snap:not(.ready) img{opacity:.12}
.viewer.snap .snap-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--fg2);font-size:13px}
.viewer.snap.ready .snap-load{display:none}
.viewer.snap .snap-bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(0deg,rgba(0,0,0,.88),rgba(0,0,0,0));font-size:12px;color:var(--fg2);z-index:2}
.viewer.snap a.cover{position:absolute;inset:0;z-index:1}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-family:var(--disp);letter-spacing:.1em;font-size:11px;color:var(--mute);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line2);text-transform:uppercase;white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tabs button{background:none;border:0;color:var(--mute);padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--acc)}

/* toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1d1d21;border:1px solid var(--line2);border-left:3px solid var(--acc);padding:12px 18px;border-radius:6px;font-size:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:up .3s ease both;max-width:90vw}
.toast.bad{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.foot{border-top:1px solid var(--line);padding:40px 0;color:var(--mute);font-size:13px;margin-top:80px}
.foot .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line3);border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.fade{animation:fade .5s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}
.notice{border:1px solid rgba(242,193,78,.4);background:rgba(242,193,78,.08);border-radius:8px;padding:14px 18px;font-size:14px;display:flex;gap:12px;align-items:flex-start}
.notice i{color:var(--warn);margin-top:3px}
.demo-badge{position:fixed;left:16px;bottom:16px;z-index:150;background:#1d1d21;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:12px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.demo-badge b{font-family:var(--disp);letter-spacing:.14em;color:var(--warn)}
.demo-badge select{background:var(--bg2);color:var(--fg);border:1px solid var(--line2);border-radius:4px;padding:4px 6px;font-size:12px}

/* ───────── AWARD SHOW ───────── */
#award{position:fixed;inset:0;z-index:100;background:#050506;color:var(--fg);overflow:hidden;display:none;user-select:none}
#award.open{display:block}
#award .horizon{position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,transparent 5%,rgba(255,217,189,.9) 50%,transparent 95%);box-shadow:0 0 40px 6px rgba(237,109,32,.4),0 0 140px 30px rgba(237,109,32,.18);transform:scaleX(var(--hx,1)) translateY(var(--hy,0));transition:transform 1.8s cubic-bezier(.2,.8,.2,1),opacity 1.2s;opacity:var(--ho,1)}
#award .glow{position:absolute;left:50%;top:50%;width:150vw;height:70vh;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(237,109,32,.22),rgba(237,109,32,.05) 40%,transparent 70%);pointer-events:none;transition:opacity 1.5s;opacity:var(--go,1)}
#award .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.75) 100%);pointer-events:none}
#award .grain{position:absolute;inset:0;opacity:.06;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.6'/></svg>")}
#award .stars{position:absolute;inset:0;pointer-events:none}
#award .st{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw var(--d,3s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes tw{from{opacity:.08;transform:scale(.6)}to{opacity:.75;transform:scale(1.25)}}
#award .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:5vh 5vw}
#award .scene{width:100%;max-width:1500px;animation:scenein 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes scenein{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
#award .topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px 110px 22px 32px;font-family:var(--disp);letter-spacing:.2em;font-size:12px;color:var(--mute);text-transform:uppercase;z-index:2}
#award .topbar b{color:var(--fg2);font-weight:600}
#award .hint{position:absolute;bottom:20px;right:28px;font-size:12px;color:var(--mute);letter-spacing:.06em;display:flex;gap:14px;transition:opacity .6s;z-index:2}
#award .hint kbd{border:1px solid var(--line2);border-radius:4px;padding:1px 6px;font-family:var(--disp);color:var(--fg2);font-size:11px}
#award .hint.hide{opacity:0}
#award .progress{position:absolute;bottom:0;left:0;height:2px;background:var(--acc);transition:width .6s;z-index:2}
#award .exit{position:absolute;top:18px;right:28px;z-index:3;background:none;border:1px solid var(--line2);color:var(--mute);border-radius:4px;padding:6px 10px;font-size:11px;letter-spacing:.14em;font-family:var(--disp);cursor:pointer}
#award .exit:hover{color:var(--fg);border-color:var(--fg)}

.aw-eyebrow{font-family:var(--disp);letter-spacing:.34em;color:var(--acc);font-size:clamp(13px,1.3vw,20px);text-transform:uppercase;font-weight:600}
.aw-title{font-size:clamp(46px,8.6vw,150px);font-weight:800;letter-spacing:-.045em;line-height:.96}
.aw-title .ln{display:block;overflow:hidden}
.aw-title .ln span{display:inline-block;animation:rise 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--dl,0s)}
@keyframes rise{from{transform:translateY(110%);opacity:0}to{transform:none;opacity:1}}

/* mShots 는 첫 요청에 400×300 "생성 중" GIF 를 주고 10~20초 뒤 실제 스크린샷(1280 폭)을 준다.
   실제 이미지가 올 때까지 같은 URL 을 다시 받아온다 (no-cors reload 로 브라우저 캐시를 갱신한 뒤 img 재로딩) */
function snapCheck(img) {
  const box = img.parentElement;
  if (img.naturalWidth >= 600) { box.classList.add('ready'); return; }
  const n = (+img.dataset.tries || 0) + 1; img.dataset.tries = n;
  if (n > 12) { box.classList.add('ready'); return; }
  setTimeout(async () => { if (!img.isConnected) return; try { await fetch(img.dataset.src, { mode: 'no-cors', cache: 'reload' }); } catch (e) { } img.src = ''; img.src = img.dataset.src; }, 5000);
}
function snapFail(img) { const box = img.parentElement; box.classList.add('ready'); const l = box.querySelector('.snap-load'); if (l) { l.style.display = 'flex'; l.innerHTML = '<i class="fa-solid fa-arrow-up-right-from-square" style="font-size:26px;color:var(--acc)"></i><span>미리보기를 만들 수 없는 링크입니다. 새 창에서 열어 주세요.</span>'; } }
function computeResultsLocal(entries, votes, scores) {
  const count = {}; votes.forEach(v => (v.entryIds || []).forEach(id => count[id] = (count[id] || 0) + 1));
  const sc = {}; scores.forEach(s => sc[s.entryId] = s);
  const live = entries.filter(e => e.status !== 'deleted');
  const eligible = live.filter(e => e.status !== 'excluded');
  const maxVotes = eligible.reduce((m, e) => Math.max(m, count[e.id] || 0), 0) || 1;
  const list = live.map(e => {
    const s = sc[e.id]; const v = count[e.id] || 0; const ceoPart = s ? s.score * .5 : 0; const votePart = v / maxVotes * 50;
    return Object.assign({}, e, { ceoScore: s ? s.score : null, ceoComment: s ? s.comment : '', votes: v, ceoPart: +ceoPart.toFixed(2), votePart: +votePart.toFixed(2), total: e.status === 'excluded' ? -1 : +(ceoPart + votePart).toFixed(2) });
  }).sort((a, b) => b.total - a.total || (b.ceoScore || 0) - (a.ceoScore || 0) || b.votes - a.votes || new Date(a.createdAt) - new Date(b.createdAt));
  let r = 0; list.forEach(e => e.rank = e.status === 'excluded' ? null : ++r);
  return { list, maxVotes, totalVoters: votes.length, prizeCount: CONFIG.PRIZES.length, computedAt: Date.now() };
}

    stage.innerHTML = '<div class="scene"><div style="text-align:center"><div class="aw-eyebrow" style="margin-bottom:22px">AX Hackathon 2026 · Winners</div><h2 class="aw-title" style="font-size:clamp(34px,5.6vw,100px)">축하합니다</h2></div>'
      + '<div class="podium">' + pod(W[1], 'second', .2) + pod(W[0], 'first', 0) + pod(W[2], 'third', .4) + '</div><div class="pod-row2">' + pod(W[3], '', .6) + pod(W[4], '', .8) + '</div></div>';
    if (!keep) rainConfetti(9000);
  } else if (st.t === 'end') {
    // 수평선을 장면 안에 그려 제목과 겹치지 않게: 로고 → 세로선이 수평선으로 떨어짐 → 제목 → 인사
    setHorizon(1, '0px', 0, 1);
    stage.innerHTML = '<div class="scene" style="text-align:center"><div class="standby-logo">egoidsm</div><div class="standby-line" style="margin:26px auto 0"></div><div class="hz-inline" style="margin:0 -6vw clamp(30px,5vh,60px)"></div><h2 class="aw-title" style="font-size:clamp(30px,4.6vw,84px)">미지의 영역을 개척하는<br>브랜드 창조자</h2><p class="aw-lead" style="margin:30px auto 0;text-align:center">모든 크루의 항해에 감사드립니다.<br><span class="mute">AX HACKATHON 2026 · 2026. 10. 21 – 23</span></p></div>';
  }
}
/* 수상자 화면의 미디어 영역만 부분 교체 — 왼쪽 수상 정보는 다시 그리지 않아 애니메이션이 재생되지 않음 */
function awMediaHTML(media) {
  const idx = Math.max(0, Math.min(AW.mediaIdx, media.length - 1)); const m = media[idx];
  return viewerHTML(m, true)
    + (media.length > 1 ? '<div class="thumbs">' + media.map((x, i) => '<button class="' + (i === idx ? 'on' : '') + '" onclick="event.stopPropagation();awSetMedia(' + i + ')"><i class="fa-solid ' + esc(x.icon) + '"></i>' + esc(x.label) + '</button>').join('') + '</div>' : '')
    + (media.some(x => x.url) ? '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' + media.filter(x => x.url).map(x => '<a class="btn xs ghost" target="_blank" rel="noopener" href="' + esc(x.url) + '"><i class="fa-solid fa-arrow-up-right-from-square"></i>' + esc(x.label) + '</a>').join('') + '</div>' : '');
}
function awSetMedia(i) {
  const st = AW.steps[AW.i]; if (!st || st.t !== 'reveal') return;
  const media = mediaList(st.w); if (!media.length) return;
  AW.mediaIdx = Math.max(0, Math.min(i, media.length - 1));
  const box = $('#awMedia'); if (box) box.innerHTML = awMediaHTML(media);
}
const CONF_COLORS = ['#ED6D20', '#ff8a3d', '#ffd9bd', '#f4f2ed', '#e8c27a'];
// ?motion=0 : 컨페티 끄기 (저사양 발표 노트북 · 리허설용)
const NO_MOTION = new URLSearchParams(location.search).get('motion') === '0' || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function fireConfetti(rank) {
  if (typeof confetti !== 'function' || NO_MOTION) return;
  const base = { colors: CONF_COLORS, zIndex: 120, disableForReducedMotion: true };
  const power = rank === 1 ? 3 : rank === 2 ? 2 : 1.2;
  confetti(Object.assign({ particleCount: 120 * power, spread: 80, origin: { x: .2, y: .7 }, angle: 60, startVelocity: 55, scalar: 1.1 }, base));
  confetti(Object.assign({ particleCount: 120 * power, spread: 80, origin: { x: .8, y: .7 }, angle: 120, startVelocity: 55, scalar: 1.1 }, base));
  if (rank <= 2) setTimeout(() => confetti(Object.assign({ particleCount: 200 * power, spread: 160, origin: { x: .5, y: .4 }, startVelocity: 45, ticks: 300, gravity: .8 }, base)), 500);
  if (rank === 1) { const end = Date.now() + 6000; (function frame() { confetti(Object.assign({ particleCount: 6, angle: 60, spread: 70, origin: { x: 0, y: .6 } }, base)); confetti(Object.assign({ particleCount: 6, angle: 120, spread: 70, origin: { x: 1, y: .6 } }, base)); if (Date.now() < end && AW.open) requestAnimationFrame(frame); })(); }
}
function rainConfetti(ms) {
  if (typeof confetti !== 'function' || NO_MOTION) return; const end = Date.now() + ms;
  (function frame() { confetti({ particleCount: 4, startVelocity: 0, ticks: 400, gravity: .5, origin: { x: Math.random(), y: -.05 }, colors: CONF_COLORS, zIndex: 120, scalar: 1.2, drift: Math.random() - .5 }); if (Date.now() < end && AW.open) requestAnimationFrame(frame); })();
}

/* ═══════════════ 데모 배지 — 배포 빌드에서 제거됨 ═══════════════ */

/* ═══════════════ 시작 ═══════════════ */
renderNav(); tick(); refresh();
